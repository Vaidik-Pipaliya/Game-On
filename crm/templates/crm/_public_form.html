<form method="post" novalidate class="panel panel-pad">
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="alert alert-danger" role="alert" aria-live="polite"><span class="msym">error</span> {% for e in form.non_field_errors %}{{ e }} {% endfor %}</div>{% endif %}
  {% for field in form %}
    {% if field.name == "website" %}{{ field }}{% else %}{% include "partials/field.html" with field=field %}{% endif %}
  {% endfor %}
  <button class="btn btn-primary btn-lg w-100">{{ submit_label }}</button>
</form>
