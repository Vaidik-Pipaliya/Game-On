<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Champions Club{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">Champions Club</a>
    <div class="ms-auto d-flex align-items-center gap-2 text-white">
      {% if user.is_authenticated %}
        <span class="small">{{ user.email }} ({{ user.role }})</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}
          <button class="btn btn-sm btn-outline-light">Log out</button>
        </form>
      {% else %}
        <a class="btn btn-sm btn-light" href="{% url 'login' %}">Log in</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">
  {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
